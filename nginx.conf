server {
    listen 80;
    server_name localhost;

    # Do not advertise the nginx version in responses/error pages
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # --- Security headers -----------------------------------------------------
    # Clickjacking protection: X-Frame-Options (legacy) + CSP frame-ancestors.
    # A CSP containing only frame-ancestors does NOT restrict scripts/styles,
    # so it is safe to add without breaking the SPA.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # Ignored by browsers over plain HTTP; enforced when TLS terminates upstream.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Serve static assets
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: Cache control for static assets
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
        # NOTE: declaring add_header here overrides inherited headers, so the
        # security headers must be repeated for this location.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
